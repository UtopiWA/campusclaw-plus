schema: spec-driven

context: |
  团队项目名为 CampusClaw-Plus，继承 CampusClaw 的实现与历史。完整目标、成员 A/B 分工和实施阶段见 docs/project-scope.md，当前实现、活动 change 与交付门槛以 docs/project-status.md 为准。
  最终目标包括知识图谱与掌握度画像、个性化学习计划、自适应练习、班级共性错误分析及受控智能体协作；这些属于规划，不能写成当前已实现能力。
  规范读取按 AGENTS 的范围表执行，安全与测试规范适用于所有修改。规范正文区分已有约定、继承例外和待实现目标，不能把文件存在或模板命令当作运行通过。
  两名成员以完整模块或开发/测试角色分工，避免拆分同一功能的页面、接口和数据；模块责任及交叉评审见 docs/project-scope.md。
  具体验收证据集中在 docs/lesson-*/ 中，项目状态只保留摘要和链接。成员实际确认与代理执行结果分开记录，不代签；测试通过不等于依赖风险已接受，不提前同步或归档。
  CampusClaw 是面向中小学班级场景的教研智能体平台，已具备账号登录、教师/学生权限、服务端班级隔离、材料与异步索引、可追溯检索、技能/智能体配置、私人持久化流式会话和 MCP 工具管理/调用/审计。
  已归档行为基线由 openspec/specs 维护；未归档 change 的规约和验收记录须同时核对，文件存在不代表实现或交付完成。
  平台支持 .txt/.md 上传、同班在线查看与原文件下载；教师管理本班材料和配置，学生不能执行这些管理操作。直接检索位于 /materials，教师配置与 MCP 位于 /assistants，持久化问答位于 /conversations，旧 /search 重定向至材料页。
  技术栈为 Vue 3、Vite、Java 17、Spring Boot 4、MySQL 8、Qdrant、RabbitMQ、Bearer JWT、Python MCP 示例服务和 Docker Compose；保持既有 HTTP JSON、SSE 和迁移兼容。
  问答材料在 RRF 后、取前四条之前应用 0.55 强向量或 0.45 双路确认门；直接搜索仍采用 0.35 向量宽召回。安全 MCP 结果可独立支持会话生成；材料与工具均无依据才生成前固定拒答。
  技能与工具由服务端确定性选择，命中技能时由 knowledge_search 决定是否检索；模型不选工具或构造参数，MCP 无自动重试，摘要随 SSE 和消息快照恢复。
  /assignments 已实现教师创建文本作业、学生提交、RabbitMQ/事务性发件箱/独立 worker 异步批改和结果查询；原未接受的依赖风险已通过独立升级整改，默认完整扫描零告警；Class08 与升级 change 尚待实际成员复核和归档，不等于已完成交付。作业已支持参考答案综合评分、单次提交和独立教师终评；完整题库、错题、知识点画像和学习计划未实现，早期表或禁用菜单不等于已有能力。
  班级是数据边界，所有业务读写都必须使用 Bearer JWT 标识用户在数据库中的最新 class_id；客户端不得指定或覆盖数据所属班级。
  密码必须哈希存储，数据库凭据、演示种子口令等敏感配置必须来自服务端环境变量。
  规约变更必须先于实现；实现完成后按 tasks.md 逐项验证，且不得提交真实密钥或生成数据。
  团队 Docker 部署默认项目 campusclaw-plus，网页/MySQL/RabbitMQ 管理端口为 18080/13306/15673，仅本机访问；私有 .env.team 与旧项目配置分开。部署差异以当前 Docker 实测和 README 为准，不复用旧项目的数据卷。
  仓库内文档只引用仓库内可交付文件，不依赖仓库外目录。

rules:
  proposal:
    - 必须分别写清 Why、What Changes、Capabilities、Impact 和 Non-goals。
    - 必须明确本次范围与 Non-goals，并说明对现有主规格、权限边界和数据模型的影响。
  design:
    - 涉及身份、班级数据、文件或部署时，必须明确安全边界、失败处理、数据一致性与迁移方案。
    - 新页面应复用既有应用壳和设计令牌；新增接口不得削弱服务端授权与 class_id 隔离。
    - 记录重要备选方案和取舍，不把前端隐藏控件视为授权措施。
  specs:
    - 每个 Requirement 至少包含一个可直接判定通过或失败的 Scenario。
    - 按功能风险覆盖成功、未认证、越权、跨班、非法输入和失败回滚等相关路径。
  tasks:
    - 按实际依赖顺序分节，避免实现任务先于其数据、接口或安全前置条件。
    - 每个任务都必须附带可执行的 verify，初始 checkbox 保持为未勾选状态。

operations:
  apply:
    guidance:
      - 严格按 tasks.md 顺序实现，并在每项验证通过后再勾选。
      - 不得绕过 spec 中的服务端权限、班级隔离和失败回滚要求。
