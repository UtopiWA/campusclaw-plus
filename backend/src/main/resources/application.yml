server:
  port: ${SERVER_PORT:8080}

spring:
  main:
    banner-mode: "off"
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 3000
      validation-timeout: 2000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_BYTES:2097152}
      max-request-size: ${MAX_UPLOAD_BYTES:2097152}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: ${GRADING_PREFETCH:1}
        concurrency: ${GRADING_CONCURRENCY:1}
        max-concurrency: ${GRADING_CONCURRENCY:1}

# 即使全局开启 debug，也不记录外部模型请求正文或响应正文。
logging:
  level:
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO
    org.springframework.web.client: INFO
    org.springframework.http.converter: INFO
    org.springframework.security.oauth2.server.resource: INFO

app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  max-upload-bytes: ${MAX_UPLOAD_BYTES:2097152}
  demo-seed:
    enabled: ${DEMO_SEED_ENABLED:false}
    password: ${DEMO_SEED_PASSWORD:}
  auth:
    jwt:
      secret: ${AUTH_JWT_SECRET}
      ttl: ${AUTH_JWT_TTL:PT8H}
  qdrant:
    url: ${QDRANT_URL}
    collection: ${QDRANT_COLLECTION:campusclaw_chunks}
  embedding:
    base-url: ${EMBEDDING_BASE_URL}
    api-key: ${EMBEDDING_API_KEY}
    model: ${EMBEDDING_MODEL}
    dimension: ${EMBEDDING_DIMENSION}
  chat:
    base-url: ${CHAT_BASE_URL}
    api-key: ${CHAT_API_KEY}
    model: ${CHAT_MODEL}
    reasoning-effort: ${CHAT_REASONING_EFFORT:none}
  retrieval:
    connect-timeout: ${RETRIEVAL_CONNECT_TIMEOUT:3s}
    read-timeout: ${RETRIEVAL_READ_TIMEOUT:30s}
    query-max-code-points: ${RETRIEVAL_QUERY_MAX_CODE_POINTS:1000}
    default-limit: ${RETRIEVAL_DEFAULT_LIMIT:10}
    max-limit: ${RETRIEVAL_MAX_LIMIT:20}
    vector-threshold: ${RETRIEVAL_VECTOR_THRESHOLD:0.35}
    answer-strong-vector-threshold: ${RETRIEVAL_ANSWER_STRONG_VECTOR_THRESHOLD:0.55}
    answer-corroborated-vector-threshold: ${RETRIEVAL_ANSWER_CORROBORATED_VECTOR_THRESHOLD:0.45}
    rrf-k: ${RETRIEVAL_RRF_K:60}
    initialize-vector-store: ${RETRIEVAL_INITIALIZE_VECTOR_STORE:true}
  mcp:
    token-encryption-key: ${MCP_TOKEN_ENCRYPTION_KEY}
    allowed-hosts: ${MCP_ALLOWED_HOSTS:mcp-demo}
    connect-timeout: ${MCP_CONNECT_TIMEOUT:3s}
    read-timeout: ${MCP_READ_TIMEOUT:10s}
  grading:
    worker-enabled: ${GRADING_WORKER_ENABLED:false}
    publisher-enabled: ${GRADING_PUBLISHER_ENABLED:true}
    recovery-enabled: ${GRADING_RECOVERY_ENABLED:false}
    max-attempts: ${GRADING_MAX_ATTEMPTS:5}
    backoff-base: ${GRADING_BACKOFF_BASE:5s}
    backoff-multiplier: ${GRADING_BACKOFF_MULTIPLIER:2}
    backoff-jitter: ${GRADING_BACKOFF_JITTER:0.2}
    backoff-max: ${GRADING_BACKOFF_MAX:5m}
    stale-running-timeout: ${GRADING_STALE_TIMEOUT:90s}
    outbox-retry-delay: ${GRADING_OUTBOX_RETRY_DELAY:5s}
    outbox-batch-size: ${GRADING_OUTBOX_BATCH_SIZE:20}
    confirm-timeout: ${GRADING_CONFIRM_TIMEOUT:5s}
    prompt-version: ${GRADING_PROMPT_VERSION:v1}
    exchange: ${GRADING_EXCHANGE:grading.events}
    task-queue: ${GRADING_TASK_QUEUE:grading.tasks}
    dead-letter-queue: ${GRADING_DLQ:grading.dlq}
    dispatch-routing-key: ${GRADING_DISPATCH_KEY:grading.dispatch}
    retry-routing-key: ${GRADING_RETRY_KEY:grading.retry}
    dead-letter-routing-key: ${GRADING_DLQ_KEY:grading.dead-letter}
