name: security-gate

# 完整安全门禁需要 Docker、私有 .env.team、Gitleaks 镜像、真实/受控模型环境，
# 因此固定绑定团队自托管运行器。运行器上必须放好私有配置（不进入仓库），
# 并通过仓库变量 CAMPUSCLAW_ENV_FILE 指向它（默认 .env.team）。
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-gate:
    name: security gate (scan + access + audit + api + unit)
    runs-on: [self-hosted, linux, x64, campusclaw]
    timeout-minutes: 60
    env:
      ENV_FILE: ${{ vars.CAMPUSCLAW_ENV_FILE || '.env.team' }}
      APITEST_ENV_FILE: ${{ vars.CAMPUSCLAW_ENV_FILE || '.env.team' }}
      PYTHON: python3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Verify private environment and Docker
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ENV_FILE" || { echo "missing $ENV_FILE on self-hosted runner"; exit 2; }
          docker info >/dev/null
          python3 --version

      - name: Run security gate
        shell: bash
        run: python3 scripts/security_gate.py --env-file "$ENV_FILE" --exceptions security-exceptions.json

      - name: Upload security gate summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-gate-${{ github.run_id }}
          path: backend/target/security-gate/
          if-no-files-found: warn
          retention-days: 30
