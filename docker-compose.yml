name: campusclaw-plus

x-grading-environment: &grading-environment
  GRADING_MAX_ATTEMPTS: ${GRADING_MAX_ATTEMPTS:-5}
  GRADING_BACKOFF_BASE: ${GRADING_BACKOFF_BASE:-5s}
  GRADING_BACKOFF_MULTIPLIER: ${GRADING_BACKOFF_MULTIPLIER:-2}
  GRADING_BACKOFF_JITTER: ${GRADING_BACKOFF_JITTER:-0.2}
  GRADING_BACKOFF_MAX: ${GRADING_BACKOFF_MAX:-5m}
  GRADING_STALE_TIMEOUT: ${GRADING_STALE_TIMEOUT:-90s}
  GRADING_OUTBOX_RETRY_DELAY: ${GRADING_OUTBOX_RETRY_DELAY:-5s}
  GRADING_OUTBOX_BATCH_SIZE: ${GRADING_OUTBOX_BATCH_SIZE:-20}
  GRADING_CONFIRM_TIMEOUT: ${GRADING_CONFIRM_TIMEOUT:-5s}
  GRADING_PROMPT_VERSION: ${GRADING_PROMPT_VERSION:-v4}
  GRADING_PREFETCH: ${GRADING_PREFETCH:-1}
  GRADING_CONCURRENCY: ${GRADING_CONCURRENCY:-1}
  GRADING_EXCHANGE: ${GRADING_EXCHANGE:-grading.events}
  GRADING_TASK_QUEUE: ${GRADING_TASK_QUEUE:-grading.tasks}
  GRADING_DLQ: ${GRADING_DLQ:-grading.dlq}
  GRADING_DISPATCH_KEY: ${GRADING_DISPATCH_KEY:-grading.dispatch}
  GRADING_RETRY_KEY: ${GRADING_RETRY_KEY:-grading.retry}
  GRADING_DLQ_KEY: ${GRADING_DLQ_KEY:-grading.dead-letter}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-13306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-campusclaw}
      MYSQL_USER: ${MYSQL_USER:-campusclaw}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--ngram-token-size=2"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:v1.15.4
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.4.0-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mcp-demo:
    build:
      context: ./mcp-server
    restart: unless-stopped
    environment:
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN}
      MCP_PORT: 8090
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    image: ${COMPOSE_PROJECT_NAME:-campusclaw-plus}-backend:local
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      <<: *grading-environment
      # 未设置时不注入，后端使用构建元数据；显式空值会被后端拒绝。
      APP_VERSION:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-campusclaw}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC
      DB_USERNAME: ${MYSQL_USER:-campusclaw}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2097152}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_JWT_TTL: ${AUTH_JWT_TTL:-PT8H}
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-false}
      DEMO_SEED_PASSWORD: ${DEMO_SEED_PASSWORD}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-campusclaw_chunks}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION}
      CHAT_BASE_URL: ${CHAT_BASE_URL}
      CHAT_API_KEY: ${CHAT_API_KEY}
      CHAT_MODEL: ${CHAT_MODEL}
      CHAT_REASONING_EFFORT: ${CHAT_REASONING_EFFORT-none}
      RETRIEVAL_CONNECT_TIMEOUT: ${RETRIEVAL_CONNECT_TIMEOUT:-3s}
      RETRIEVAL_READ_TIMEOUT: ${RETRIEVAL_READ_TIMEOUT:-30s}
      RETRIEVAL_VECTOR_THRESHOLD: ${RETRIEVAL_VECTOR_THRESHOLD:-0.35}
      RETRIEVAL_ANSWER_STRONG_VECTOR_THRESHOLD: ${RETRIEVAL_ANSWER_STRONG_VECTOR_THRESHOLD:-0.55}
      RETRIEVAL_ANSWER_CORROBORATED_VECTOR_THRESHOLD: ${RETRIEVAL_ANSWER_CORROBORATED_VECTOR_THRESHOLD:-0.45}
      RETRIEVAL_RRF_K: ${RETRIEVAL_RRF_K:-60}
      MCP_TOKEN_ENCRYPTION_KEY: ${MCP_TOKEN_ENCRYPTION_KEY}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-mcp-demo}
      MCP_CONNECT_TIMEOUT: ${MCP_CONNECT_TIMEOUT:-3s}
      MCP_READ_TIMEOUT: ${MCP_READ_TIMEOUT:-10s}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      GRADING_WORKER_ENABLED: "false"
      GRADING_PUBLISHER_ENABLED: "true"
      GRADING_RECOVERY_ENABLED: "false"
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mcp-demo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  grading-worker:
    image: ${COMPOSE_PROJECT_NAME:-campusclaw-plus}-backend:local
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      <<: *grading-environment
      SPRING_PROFILES_ACTIVE: worker
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-campusclaw}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC
      DB_USERNAME: ${MYSQL_USER:-campusclaw}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      UPLOAD_DIR: /app/uploads
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      DEMO_SEED_ENABLED: "false"
      DEMO_SEED_PASSWORD: ${DEMO_SEED_PASSWORD}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-campusclaw_chunks}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION}
      CHAT_BASE_URL: ${CHAT_BASE_URL}
      CHAT_API_KEY: ${CHAT_API_KEY}
      CHAT_MODEL: ${CHAT_MODEL}
      CHAT_REASONING_EFFORT: ${CHAT_REASONING_EFFORT-none}
      RETRIEVAL_CONNECT_TIMEOUT: ${RETRIEVAL_CONNECT_TIMEOUT:-3s}
      RETRIEVAL_READ_TIMEOUT: ${RETRIEVAL_READ_TIMEOUT:-30s}
      RETRIEVAL_VECTOR_THRESHOLD: ${RETRIEVAL_VECTOR_THRESHOLD:-0.35}
      RETRIEVAL_ANSWER_STRONG_VECTOR_THRESHOLD: ${RETRIEVAL_ANSWER_STRONG_VECTOR_THRESHOLD:-0.55}
      RETRIEVAL_ANSWER_CORROBORATED_VECTOR_THRESHOLD: ${RETRIEVAL_ANSWER_CORROBORATED_VECTOR_THRESHOLD:-0.45}
      RETRIEVAL_RRF_K: ${RETRIEVAL_RRF_K:-60}
      MCP_TOKEN_ENCRYPTION_KEY: ${MCP_TOKEN_ENCRYPTION_KEY}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-mcp-demo}
      MCP_CONNECT_TIMEOUT: ${MCP_CONNECT_TIMEOUT:-3s}
      MCP_READ_TIMEOUT: ${MCP_READ_TIMEOUT:-10s}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      GRADING_WORKER_ENABLED: "true"
      GRADING_PUBLISHER_ENABLED: "false"
      GRADING_RECOVERY_ENABLED: "true"
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-18080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
  uploads-data:
  qdrant-data:
  rabbitmq-data:
